version: "3.9"

services:
  solidjs-dev:
    image: oven/bun:1.2
    container_name: opencode-solidjs-dev
    working_dir: /app
    volumes:
      - ../../:/app
      - solidjs_node_modules:/app/node_modules
      - solidjs_app_node_modules:/app/packages/app/node_modules
      - solidjs_ui_node_modules:/app/packages/ui/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://host.docker.internal:8080
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        bun run --cwd packages/app dev
      "
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true

  # OpenCode 后端服务（可选）
  opencode-server:
    image: oven/bun:1.2
    container_name: opencode-server
    working_dir: /app
    volumes:
      - ../../:/app
      - server_node_modules:/app/node_modules
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        bun run --cwd packages/server dev
      "
    profiles:
      - with-server

volumes:
  solidjs_node_modules:
  solidjs_app_node_modules:
  solidjs_ui_node_modules:
  server_node_modules:
